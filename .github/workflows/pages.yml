# Project page (GitHub Pages): publishes the committed site/ folder as it is.
#
# Not triggered automatically. It runs only when started by hand (Actions -> "Project page" -> Run workflow),
# and only after the author enables GitHub Pages with "Source: GitHub Actions" (docs/DECISOES.md, D10).
# Before that, a run fails at the deploy step because the repository has no Pages site.
#
# site/ is generated by docs/scripts/build_site.py from results/ and committed; this workflow does not rebuild it.
# tests/test_build_site.py (run by ci.yml) fails if site/ is stale, so what is deployed is what the tests checked.
# To deploy on every push to main once Pages is enabled, uncomment the "push" block below (author decision).
name: Project page

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["site/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs, as in GitHub's official Pages template: the job boundary
  # guarantees the "github-pages" artifact is finalized before deploy-pages looks it up. With both
  # steps in one job, deploy-pages found 0 artifacts right after a successful upload (2026-11-27,
  # runs 45920351850 and 45920610685).
  build:
    name: package site/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check that site/ exists and has both pages
        run: |
          test -f site/index.html
          test -f site/index.pt-BR.html
          test -f site/build_provenance.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy site/
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
