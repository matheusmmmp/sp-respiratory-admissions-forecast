# ============================================================================
# smoke.yaml — teste de fumaça do pipeline (NUNCA é resultado).
#
# Derivado de configs/h1_v02_cetesb_cetesb_classicos.yaml (run exibida
# h1_v02_cetesb_cetesb_classicos_full_20261022-211834), reduzido para rodar em
# menos de 2 minutos na CPU: 1 fold curto, 1 semente, Naïve + Seasonal Naïve +
# XGBoost (count:poisson), dois conjuntos de features. LSTM, SARIMAX, GAM-NB e
# INGARCH-NB ficam desligados. Executar sempre com --smoke:
#
#   uv run python -m src.experiments.run_preliminary --config configs/smoke.yaml --smoke
# ============================================================================

run:
  nome: smoke
  seed: 42
  sementes: [42]

dados:
  sih: data/processed/sih_daily_lookahead.parquet
  cams: data/processed/cams_daily_v2.csv     # eixo de datas exigido pelo construtor; não entra nas features
  inicio: 2019-01-01
  fim: 2024-12-31
  fonte_pm25: cetesb
  cetesb: data/processed/cetesb_poluentes_daily.csv
  fonte_meteo: cetesb
  meteo: data/processed/cetesb_meteo_daily.csv
  permitir_duas_fontes: true
  alvo:
    validado_contra_fonte_oficial: true
    validacao:
      fonte: "TabNet/DATASUS — Morbidade Hospitalar do SUS por local de residência, SP"
      coluna_comparada: "Ano/mês atendimento (equivalente a DT_INTER)"
      data: 2026-07-27
      meses_comparados: 72
      correlacao_mensal: 0.999983
      erro_absoluto_medio_mensal: 14.1
      maior_divergencia_anual_pct: 0.41
      vies_sistematico_pct: -0.34
      ressalva: >
        Viés constante de -0,34% em 68 dos 69 meses fora da região de look-ahead.
        EM ABERTO — não bloqueia.
    target_source: "SIH/SUS DATASUS — AIH-RD (microdados), datasus-fetcher + FTP direto"
    target_definition: "contagem diária de AIH distintas com DIAG_PRINC iniciando em J"
    spatial_criterion: "MUNIC_RES (residência) = 355030"
    CID_rule: "str(DIAG_PRINC).strip().upper().startswith('J')"
    date_field: "DT_INTER"
    start_date: "2019-01-01"
    end_date: "2024-12-31"
    observacao: "look-ahead de 6 competências (2025-01..06)"

experimento:
  horizonte: 1
  periodo_sazonal: 7
  lags_alvo: [1, 2, 3, 7, 14, 28]
  lags_exogenas: [1, 2, 3, 7, 14]
  lookback: 28

split:
  protocolo: rolling_origin
  n_folds: 4
  dias_teste: 180
  dias_validacao: 180
  treino_minimo: 730

feature_sets:
  AR:      [AR]
  AR_CAL:  [AR, CAL]

modelos:
  naive:
    ativo: true
  seasonal_naive:
    ativo: true
  xgboost:
    ativo: true
    objetivo: count:poisson
    selecionar_objetivo: false
    n_estimators: 600
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    reg_lambda: 1.0
    early_stopping_rounds: 50
  lstm:
    ativo: false
    unidades: 32
    dropout: 0.2
    learning_rate: 0.001
    epocas: 150
    batch_size: 32
    paciencia: 15

# Reduções aplicadas com --smoke.
smoke:
  n_folds: 1
  dias_teste: 30
  dias_validacao: 60
  treino_minimo: 365
  sementes: [42]
  epocas: 3
  n_estimators: 30
  feature_sets: [AR, AR_CAL]
